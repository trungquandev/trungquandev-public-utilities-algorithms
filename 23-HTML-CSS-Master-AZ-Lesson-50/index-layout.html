  <!-- 
    rel="stylesheet": cho trình duyệt biết đây là một file thiết kế giao diện CSS
    integrity: Một mã khóa bảo mật. Trình duyệt dựa vào mã này để kiểm tra xem file tải từ CDN về có bị ai sửa đổi, chèn mã độc hay không.
    crossorigin="anonymous": Yêu cầu trình duyệt lấy dữ liệu về một cách ẩn danh, nghĩa là không mang theo Cookie, mật khẩu hay thông tin gì khác của người dùng. Đại loại là để bảo vệ thông tin cho bạn.
    referrerpolicy="no-referrer": Không cho trình duyệt tiết lộ với máy chủ tài nguyên là bạn đang đứng từ trang web nào trong lúc tải file dữ liệu về.
  -->
